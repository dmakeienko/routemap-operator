replicaCount: 1

image:
  repository: dmakeienko12/routemap-operator
  pullPolicy: Always
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  kubectl.kubernetes.io/default-container: manager

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

leaderElect: true

healthProbeBindAddress: ":8081"

dashboard:
  enabled: true
  bindAddress: ":9090"
  # service controls how the dashboard port is exposed
  service:
    enabled: true
    type: ClusterIP
    port: 9090
  # expose creates an HTTPRoute or Ingress in front of the dashboard service.
  # Set type to "HTTPRoute" or "Ingress"; leave empty to disable.
  expose:
    type: ""
    # path: /
    # annotations: {}

    # HTTPRoute-specific fields (type: HTTPRoute)
    # parentRefs:
    #   - name: my-gateway
    #     namespace: gateway-ns
    # hostnames:
    #   - dashboard.example.com

    # Ingress-specific fields (type: Ingress)
    # ingressClassName: nginx
    # hostnames:
    #   - dashboard.example.com
    # tls:
    #   - secretName: dashboard-tls
    #     hosts:
    #       - dashboard.example.com

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}
