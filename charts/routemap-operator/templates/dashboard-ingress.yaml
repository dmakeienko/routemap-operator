{{- $dash := .Values.dashboard }}
{{- if and $dash.enabled $dash.service.enabled $dash.expose.type }}

{{- if eq $dash.expose.type "HTTPRoute" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "routemap-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "routemap-operator.labels" . | nindent 4 }}
  {{- with $dash.expose.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $dash.expose.parentRefs | nindent 4 }}
  {{- with $dash.expose.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $dash.expose.path | default "/" }}
      backendRefs:
        - name: {{ include "routemap-operator.fullname" . }}-dashboard
          port: {{ $dash.service.port }}

{{- else if eq $dash.expose.type "Ingress" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "routemap-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "routemap-operator.labels" . | nindent 4 }}
  {{- with $dash.expose.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $dash.expose.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $dash.expose.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $dash.expose.hostnames }}
    - host: {{ . }}
      http:
        paths:
          - path: {{ $dash.expose.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "routemap-operator.fullname" $ }}-dashboard
                port:
                  number: {{ $dash.service.port }}
    {{- end }}

{{- end }}
{{- end }}
