---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: routemaps.routemaps.github.com
  labels:
    {{- include "routemap-operator.labels" . | nindent 4 }}
spec:
  group: routemaps.github.com
  names:
    kind: Routemap
    listKind: RoutemapList
    plural: routemaps
    singular: routemap
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.discoveredEndpoints
      name: Endpoints
      type: integer
    - jsonPath: .status.healthyEndpoints
      name: Healthy
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Routemap is the Schema for the routemaps API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Routemap.
            properties:
              auth:
                description: Auth optionally protects this Routemap's dashboard with OIDC.
                properties:
                  clientID:
                    description: ClientID for the OIDC relying party.
                    type: string
                  clientSecretRef:
                    description: ClientSecretRef points to a Secret key holding the client secret.
                    properties:
                      key:
                        description: Key inside the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  issuerURL:
                    description: IssuerURL is the OIDC issuer (discovery document base URL).
                    type: string
                  redirectURL:
                    description: RedirectURL registered with the IdP for this dashboard.
                    type: string
                required:
                - clientID
                - clientSecretRef
                - issuerURL
                - redirectURL
                type: object
              displayName:
                description: DisplayName is shown as the dashboard title; defaults to the CR name.
                type: string
              healthCheck:
                description: HealthCheck configures optional active probing of discovered endpoints.
                properties:
                  annotationKey:
                    default: routemap.github.com/healthcheck
                    description: AnnotationKey overrides the annotation read from discovered Ingress/HTTPRoute to find the health path.
                    type: string
                  enabled:
                    description: Enabled turns on active probing.
                    type: boolean
                  expectedStatus:
                    default: 200
                    description: ExpectedStatus is the HTTP status treated as healthy (default 200).
                    format: int32
                    type: integer
                  interval:
                    default: 30s
                    description: Interval between probes.
                    type: string
                  timeout:
                    default: 5s
                    description: Timeout per probe.
                    type: string
                required:
                - enabled
                type: object
              namespaces:
                description: Namespaces chooses which namespaces to scan for Ingress/HTTPRoute.
                properties:
                  names:
                    description: Names is an explicit allow-list of namespaces.
                    items:
                      type: string
                    type: array
                  selector:
                    description: Selector matches namespaces by label.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector requirements.
                        items:
                          properties:
                            key:
                              type: string
                            operator:
                              type: string
                            values:
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  watchAll:
                    description: WatchAll, when true, scans every namespace.
                    type: boolean
                type: object
              sources:
                default:
                - Ingress
                - HTTPRoute
                description: Sources limits which resource kinds are discovered.
                items:
                  description: SourceKind enumerates the discoverable resource types.
                  enum:
                  - Ingress
                  - HTTPRoute
                  type: string
                type: array
            type: object
          status:
            description: status defines the observed state of Routemap.
            properties:
              conditions:
                description: Conditions represent the current state of the Routemap resource.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dashboardURL:
                description: DashboardURL is the in-cluster path serving this Routemap.
                type: string
              discoveredEndpoints:
                description: DiscoveredEndpoints is the number of consolidated endpoints.
                format: int32
                type: integer
              healthyEndpoints:
                description: HealthyEndpoints is the count passing health checks (0 if disabled).
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
