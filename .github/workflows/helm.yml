name: Helm

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint-template:
    permissions:
      contents: read
    name: Lint and Template
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Lint chart
        run: helm lint charts/routemap-operator

      - name: Template chart
        run: helm template routemap-operator charts/routemap-operator --debug
