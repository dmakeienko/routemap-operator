name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint

  verify:
    permissions:
      contents: read
    name: Verify generated code
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Regenerate manifests and code
        run: make manifests generate

      - name: Fail if generated files differ from committed
        run: |
          if ! git diff --exit-code; then
            echo "Generated files are out of date. Run 'make manifests generate' and commit the result."
            exit 1
          fi

  test:
    permissions:
      contents: read
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      cover-artifact: cover.out
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover.out
          path: cover.out
          retention-days: 1

  helm:
    permissions:
      contents: read
    name: Helm lint and template
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint charts/routemap-operator

      - name: Template chart
        run: helm template routemap-operator charts/routemap-operator --debug

  govulncheck:
    permissions:
      contents: read
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

  sonar:
    permissions:
      contents: read
      pull-requests: read
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cover.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-e2e:
    permissions:
      contents: read
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [lint, verify, test, helm]
    env:
      KIND_VERSION: v0.31.0
      KIND_CLUSTER: routemap-operator-test-e2e
      K8S_VERSION: v1.32.2
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Cache kind binary
        id: cache-kind
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/kind
          key: kind-${{ env.KIND_VERSION }}-linux-amd64

      - name: Install kind
        if: steps.cache-kind.outputs.cache-hit != 'true'
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Cache kindest/node image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/kindest-node.tar
          key: kindest-node-${{ env.K8S_VERSION }}

      - name: Pre-load kindest/node image
        run: |
          if [ -f /tmp/kindest-node.tar ]; then
            echo "Loading kindest/node:${K8S_VERSION} from cache"
            docker load -i /tmp/kindest-node.tar
          else
            echo "Pulling kindest/node:${K8S_VERSION} and saving to cache"
            docker pull "kindest/node:${K8S_VERSION}"
            docker save "kindest/node:${K8S_VERSION}" -o /tmp/kindest-node.tar
          fi

      - name: Run e2e tests
        run: make test-e2e

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== kind cluster info ==="
          kind get clusters || true
          echo "=== kubectl cluster-info ==="
          kubectl cluster-info --context "kind-${KIND_CLUSTER}" || true
          echo "=== all pods ==="
          kubectl get pods -A || true
          echo "=== controller-manager logs ==="
          kubectl logs -l control-plane=controller-manager -n routemap-operator-system --tail=100 || true
          echo "=== events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -40 || true

      - name: Cleanup kind cluster on failure
        if: failure()
        run: kind delete cluster --name "${KIND_CLUSTER}" || true
