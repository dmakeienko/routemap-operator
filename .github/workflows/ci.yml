name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint

  verify:
    permissions:
      contents: read
    name: Verify generated code
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Regenerate manifests and code
        run: make manifests generate

      - name: Fail if generated files differ from committed
        run: |
          if ! git diff --exit-code; then
            echo "Generated files are out of date. Run 'make manifests generate' and commit the result."
            exit 1
          fi

  test:
    permissions:
      contents: read
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      cover-artifact: cover.out
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cover.out
          path: cover.out
          retention-days: 1

  helm:
    permissions:
      contents: read
    name: Helm lint and template
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Lint chart
        run: helm lint charts/routemap-operator

      - name: Template chart
        run: helm template routemap-operator charts/routemap-operator --debug

  govulncheck:
    permissions:
      contents: read
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4

  sonar:
    permissions:
      contents: read
      pull-requests: read
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cover.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-e2e:
    permissions:
      contents: read
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [lint, verify, test, helm]
    env:
      KIND_VERSION: v0.31.0
      KIND_CLUSTER: routemap-operator-test-e2e
      K8S_VERSION: v1.32.2
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache kind binary
        id: cache-kind
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/bin/kind
          key: kind-${{ env.KIND_VERSION }}-linux-amd64

      - name: Install kind
        if: steps.cache-kind.outputs.cache-hit != 'true'
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Cache kindest/node image
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/kindest-node.tar
          key: kindest-node-${{ env.K8S_VERSION }}

      - name: Pre-load kindest/node image
        run: |
          if [ -f /tmp/kindest-node.tar ]; then
            echo "Loading kindest/node:${K8S_VERSION} from cache"
            docker load -i /tmp/kindest-node.tar
          else
            echo "Pulling kindest/node:${K8S_VERSION} and saving to cache"
            docker pull "kindest/node:${K8S_VERSION}"
            docker save "kindest/node:${K8S_VERSION}" -o /tmp/kindest-node.tar
          fi

      - name: Run e2e tests
        run: make test-e2e

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== kind cluster info ==="
          kind get clusters || true
          echo "=== kubectl cluster-info ==="
          kubectl cluster-info --context "kind-${KIND_CLUSTER}" || true
          echo "=== all pods ==="
          kubectl get pods -A || true
          echo "=== controller-manager logs ==="
          kubectl logs -l control-plane=controller-manager -n routemap-operator-system --tail=100 || true
          echo "=== events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -40 || true

      - name: Cleanup kind cluster on failure
        if: failure()
        run: kind delete cluster --name "${KIND_CLUSTER}" || true
