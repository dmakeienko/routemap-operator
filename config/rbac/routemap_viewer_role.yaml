# This rule is not used by the project routemap-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to routemaps.github.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: routemap-operator
    app.kubernetes.io/managed-by: kustomize
  name: routemap-viewer-role
rules:
- apiGroups:
  - routemaps.github.com
  resources:
  - routemaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - routemaps.github.com
  resources:
  - routemaps/status
  verbs:
  - get
