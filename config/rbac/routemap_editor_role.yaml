# This rule is not used by the project routemap-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the routemaps.github.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: routemap-operator
    app.kubernetes.io/managed-by: kustomize
  name: routemap-editor-role
rules:
- apiGroups:
  - routemaps.github.com
  resources:
  - routemaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - routemaps.github.com
  resources:
  - routemaps/status
  verbs:
  - get
